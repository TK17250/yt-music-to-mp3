[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yt-music-to-mp3"
dynamic = ["version"]
description = "Download songs, albums and playlists from YouTube Music as tagged MP3/M4A/Opus files with cover art, and zip them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TK17250" }]
keywords = ["youtube-music", "yt-dlp", "mp3", "music", "downloader", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]
dependencies = ["yt-dlp[default]>=2025.1.15"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ytmusic-dl = "ytmusic_dl.cli:main"
yt-music-to-mp3 = "ytmusic_dl.cli:main"

[project.urls]
Homepage = "https://github.com/TK17250/yt-music-to-mp3"
Issues = "https://github.com/TK17250/yt-music-to-mp3/issues"
Changelog = "https://github.com/TK17250/yt-music-to-mp3/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ytmusic_dl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ytmusic_dl"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
